<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Active Queue</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="orders.js"></script>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#df1a22" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="icon-192.png" />
  </head>
  <body>
    <header>
      <h1>Active Queue</h1>
    </header>
    <main>
      <div style="display: flex; margin-bottom: 24px">
        <button
          class="btn-outline btn-back"
          onclick="window.location.href = 'index.html'"
        >
          &larr; Back
        </button>
      </div>
      <ul id="orderList"></ul>
    </main>
    <!-- Custom Navigation Modal -->
    <div id="navModal" class="modal hidden">
      <div class="card modal-content" style="text-align: center">
        <h2 style="margin-top: 0; color: var(--pj-dark)">Delivery Complete!</h2>
        <p style="color: #6b7280; margin-bottom: 8px">Navigate to next stop?</p>
        <strong
          id="navAddress"
          style="
            display: block;
            margin-bottom: 24px;
            font-size: 18px;
            color: var(--pj-red);
          "
        ></strong>

        <div style="display: flex; flex-direction: column; gap: 12px">
          <button id="navGoogleBtn" class="btn-google" style="margin-top: 0">
            📍 Google Maps
          </button>
          <button id="navWazeBtn" class="btn-waze" style="margin-top: 0">
            🚙 Waze
          </button>
          <button
            class="btn-dark"
            style="margin-top: 0"
            onclick="closeNavModal()"
          >
            Cancel
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
