<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Active Queue</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script defer src="orders.js"></script>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#df1a22" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="icon-192.png" />
  </head>
  <body>
    <header>
      <div>
        <img src="logo192.png" alt="Papa Routes" class="header-icon" />
        <h1>Active Orders</h1>
      </div>
      <button id="themeToggle">🌙</button>
    </header>
    <main>
      <div style="display: flex; margin-bottom: 24px">
        <button
          class="btn-outline btn-back"
          onclick="window.location.href = 'index.html'"
        >
          &larr; Back
        </button>
      </div>
      <div
        id="map-container"
        style="
          display: none;
          flex-shrink: 0;
          min-height: 250px;
          margin-bottom: 16px;
          border-radius: 12px;
          overflow: hidden;
          border: 1px solid rgba(255, 255, 255, 0.2);
        "
      >
        <div id="map" style="height: 250px; width: 100%"></div>
      </div>
      <ul id="orderList"></ul>
    </main>

    <div id="navModal" class="modal hidden">
      <div class="card modal-content" style="text-align: center">
        <h2 style="margin-top: 0; color: var(--pj-dark)">Delivery Complete!</h2>
        <p style="color: #6b7280; margin-bottom: 8px">Navigate to next stop?</p>
        <strong
          id="navAddress"
          style="
            display: block;
            margin-bottom: 24px;
            font-size: 18px;
            color: var(--pj-red);
          "
        ></strong>

        <div style="display: flex; flex-direction: column; gap: 12px">
          <button id="navGoogleBtn" class="btn-google" style="margin-top: 0">
            📍 Google Maps
          </button>
          <button id="navWazeBtn" class="btn-waze" style="margin-top: 0">
            🚙 Waze
          </button>
          <button
            class="btn-dark"
            style="margin-top: 0"
            onclick="closeNavModal()"
          >
            Cancel
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
