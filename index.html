<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delivery Scanner</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="script.js"></script>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#df1a22" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="icon-192.png" />
  </head>
  <body>
    <header>
      <img src="logo192.png" alt="Papa Routes" class="header-icon" />
      <h1>Papa Route</h1>
    </header>
    <main>
      <div class="card">
        <strong class="section-title">Scan Receipt</strong>
        <!-- Pill-shaped primary action button -->
        <label for="cameraInput" class="custom-file-upload pill-btn">
          📸 Open Camera & Scan
        </label>
        <input
          type="file"
          accept="image/*"
          capture="environment"
          id="cameraInput"
        />
        <p id="status">Waiting for image...</p>
      </div>

      <div class="card">
        <strong class="section-title">Manual Entry</strong>
        <div class="input-group">
          <span class="input-icon">👤</span>
          <input type="text" id="manualName" placeholder="Customer Name" />
        </div>
        <div class="input-group">
          <span class="input-icon">📞</span>
          <input type="tel" id="manualPhone" placeholder="Phone Number" />
        </div>
        <div class="input-group">
          <span class="input-icon">📍</span>
          <input type="text" id="manualAddress" placeholder="Full Address" />
        </div>

        <!-- Manual Entry Options -->
        <div class="payment-toggle">
          <input
            type="radio"
            id="manualCash"
            name="manualPayment"
            value="Cash"
          />
          <label for="manualCash">💵 Cash</label>
          <input
            type="radio"
            id="manualCredit"
            name="manualPayment"
            value="Credit"
          />
          <label for="manualCredit">💳 Credit</label>
        </div>
        <div class="priority-toggle">
          <input type="checkbox" id="manualPriority" />
          <label for="manualPriority">⚠️ Running Late (Prioritize)</label>
        </div>

        <button id="addManualBtn" class="btn-green">Add Delivery</button>
      </div>

      <button
        class="btn-outline btn-view-orders"
        onclick="window.location.href = 'orders.html'"
      >
        View Active Orders
      </button>
    </main>

    <div id="reviewModal" class="modal hidden">
      <div class="card modal-content">
        <strong class="section-title">Review Scanned Order</strong>
        <div class="input-group">
          <span class="input-icon">👤</span>
          <input type="text" id="reviewName" placeholder="Customer Name" />
        </div>
        <div class="input-group">
          <span class="input-icon">📞</span>
          <input type="tel" id="reviewPhone" placeholder="Phone Number" />
        </div>
        <div class="input-group">
          <span class="input-icon">📍</span>
          <input type="text" id="reviewAddress" placeholder="Full Address" />
        </div>

        <!-- Review Modal Options -->
        <div class="payment-toggle">
          <input
            type="radio"
            id="reviewCash"
            name="reviewPayment"
            value="Cash"
          />
          <label for="reviewCash">💵 Cash</label>
          <input
            type="radio"
            id="reviewCredit"
            name="reviewPayment"
            value="Credit"
          />
          <label for="reviewCredit">💳 Credit</label>
        </div>
        <div class="priority-toggle">
          <input type="checkbox" id="reviewPriority" />
          <label for="reviewPriority">⚠️ Running Late (Prioritize)</label>
        </div>

        <div class="order-actions">
          <button id="confirmReviewBtn" class="btn-green">Confirm</button>
          <button id="cancelReviewBtn" class="btn-dark">Cancel</button>
        </div>
      </div>
    </div>
  </body>
</html>
